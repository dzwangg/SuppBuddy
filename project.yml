name: SuppBuddy
options:
  bundleIdPrefix: com.suppbuddy
  deploymentTarget:
    iOS: "17.0"
targets:
  SuppBuddy:
    type: application
    platform: iOS
    sources: [SuppBuddy]
    info:
      path: SuppBuddy/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: SuppBuddy connects to your SuppBuddy tester over Bluetooth.
        NSCameraUsageDescription: SuppBuddy photographs the supplement label and scans its barcode to identify the product.
        NSPhotoLibraryAddUsageDescription: SuppBuddy saves report cards you choose to save to your photo library.
        NSLocalNetworkUsageDescription: SuppBuddy sends test readings to the SuppBuddy server running on your local network.
        # Plain http only to local addresses (the laptop running the backend); everything else stays https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
