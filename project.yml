name: SupPal
options:
  bundleIdPrefix: com.suppal
  deploymentTarget:
    iOS: "17.0"
targets:
  SupPal:
    type: application
    platform: iOS
    sources: [SupPal]
    info:
      path: SupPal/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: SupPal connects to your SupPal tester over Bluetooth.
        NSCameraUsageDescription: SupPal photographs the supplement label and scans its barcode to identify the product.
        NSPhotoLibraryAddUsageDescription: SupPal saves report cards you choose to save to your photo library.
        NSLocalNetworkUsageDescription: SupPal sends test readings to the SupPal server running on your local network.
        # Plain http only to local addresses (the laptop running the backend); everything else stays https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
